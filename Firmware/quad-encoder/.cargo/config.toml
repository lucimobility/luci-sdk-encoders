[target.thumbv8m.main-none-eabihf]
runner = 'probe-rs run --chip MCXA256 --preverify --verify --protocol swd'

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf" # Cortex-M33

[env]
DEFMT_LOG = "info"
